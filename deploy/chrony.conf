# /etc/chrony/chrony.conf
# AWS EC2 precision time configuration for NewTrap trading engine.
#
# Uses the AWS Time Sync Service (169.254.169.123) as the preferred
# source — this is a link-local address available on all EC2 instances.
# It synchronises to GPS-disciplined atomic clocks in each AWS region.
#
# Install:
#   sudo cp deploy/chrony.conf /etc/chrony/chrony.conf
#   sudo systemctl restart chrony
#
# Verify sync:
#   chronyc tracking
#   chronyc sources -v

# AWS Time Sync Service — preferred, highest stratum
server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4

# Public NTP fallback pools
pool 0.ubuntu.pool.ntp.org iburst
pool 1.ubuntu.pool.ntp.org iburst
pool 2.ubuntu.pool.ntp.org iburst
pool 3.ubuntu.pool.ntp.org iburst

# Key file and drift tracking
keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony

# Allow large step corrections only at startup (first 3 updates)
# After that, only slew adjustments — prevents time jumping mid-session
makestep 0.1 3

# Maximum allowable skew before chrony discards a source (100 ppm)
maxupdateskew 100.0

# Sync the RTC (hardware clock) to system time
rtcsync

# Log clock statistics for post-session analysis
log tracking measurements statistics
